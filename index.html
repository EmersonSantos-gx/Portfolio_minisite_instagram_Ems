  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <style>/* ================================================================
       00. TOKENS / BASE — paleta arte + código, com fallback de fontes
       ================================================================ */
    :root{--bg:#050B16;--surface:rgba(15,27,46,.72);--cyan:#0EA5E9;--sky:#38BDF8;--clay:#D97736;--peach:#F4A261;--text:#F0F6FC;--muted:#94A3B8;--line:rgba(14,165,233,.22);--mono:'Space Mono',monospace;--sans:'Space Grotesk',sans-serif}
    *,*::before,*::after{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:25px}body{margin:0;color:var(--text);background:var(--bg);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent;overflow-x:hidden}button,input,select,textarea{font:inherit}button,a,input,select,textarea{touch-action:manipulation}button,a{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:disabled{cursor:wait;opacity:.6}a{color:inherit;text-decoration:none}img{display:block;max-width:100%}button{color:inherit}h1,h2,h3,p{margin:0}button,input,select,textarea{border-radius:0}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--peach);outline-offset:5px}::selection{background:#0ea5e955;color:white}button{border:0}svg{flex-shrink:0}i{font-style:normal}dialog{color:var(--text)}[hidden]{display:none!important}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.mono{font-family:var(--mono)}.muted{color:var(--muted)}.sky{color:var(--sky)}.peach{color:var(--peach)}.small{font-size:12px}.skip-link{position:fixed;left:16px;top:-100px;z-index:200;background:var(--cyan);padding:12px 20px;border-radius:12px}.skip-link:focus{top:16px}.container{max-width:460px;margin-inline:auto;padding-inline:16px}.icon{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}.icon svg{width:100%;height:100%}.press{transition:transform .2s,box-shadow .2s,background .2s,border-color .2s}.press:active{transform:translate(3px,3px)!important;box-shadow:none!important}.glass{background:var(--surface);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line)}.glass:hover{border-color:rgba(56,189,248,.48)}

    /* 01. BACKDROP — grid, code fragments, partículas leves (sem canvas) */
    .ambient{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;background:radial-gradient(ellipse at 15% 18%,#d9773615,transparent 42%),radial-gradient(ellipse at 90% 45%,#0ea5e915,transparent 48%),linear-gradient(140deg,#050B16,#0A1428)}
    .ambient::before{content:'';position:absolute;inset:0;background-image:linear-gradient(#38bdf808 1px,transparent 1px),linear-gradient(90deg,#38bdf808 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(ellipse,black 20%,transparent 80%)}
    .particle{position:absolute;width:3px;height:3px;background:var(--sky);border-radius:50%;box-shadow:0 0 10px #38bdf890;animation:float-particle 13s ease-in-out infinite alternate}.particle:nth-child(2n){background:var(--peach);animation-duration:18s}.ambient-code{display:none;position:absolute;color:#77a7cc29;white-space:pre;font:12px/2.2 var(--mono);transform:rotate(-7deg);user-select:none}.ambient-code.left{top:18%;right:calc(50% + 280px)}.ambient-code.right{top:48%;left:calc(50% + 280px);transform:rotate(5deg)}.desktop-note{display:none;position:fixed;bottom:38px;font:10px var(--mono);letter-spacing:2px;color:#6886a9}.desktop-note.left{left:38px}.desktop-note.right{right:38px}.scroll-progress{position:fixed;top:0;left:0;height:2px;background:linear-gradient(90deg,var(--clay),var(--cyan));width:0;z-index:100}
    .portfolio{position:relative;width:100%;max-width:460px;margin:auto;background:linear-gradient(165deg,rgba(10,20,40,.92),rgba(5,11,22,.98) 28%);overflow:hidden;min-height:100svh}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:max(22px,env(safe-area-inset-top));padding-bottom:22px}.signature{font-size:12px;font-weight:700;letter-spacing:-.5px}.signature span{color:var(--sky)}.availability{display:inline-flex;align-items:center;gap:6px;font:8px var(--mono);letter-spacing:.45px;color:#b5e6d3;white-space:nowrap}.status-dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:#54dcb0;box-shadow:0 0 0 3px #54dcb012;animation:status-pulse 2.5s ease-in-out infinite}

    /* 02. HERO / AVATAR — o gradiente gira sem girar a foto */
    .hero{position:relative;text-align:center;padding-top:10px}.hero::before{content:'';position:absolute;inset:0 -16px auto;height:250px;background:radial-gradient(ellipse at 18% 30%,#d9773628,transparent 57%),radial-gradient(ellipse at 85% 35%,#0ea5e929,transparent 52%);pointer-events:none}.hero-art{position:absolute;top:27px;left:14px;width:70px;height:80px;opacity:.33;transform:rotate(-16deg);background:repeating-linear-gradient(0deg,transparent 0 8px,#d97736 9px 11px,transparent 13px 18px);border-radius:60% 20% 50% 30%;mask-image:linear-gradient(90deg,transparent,black,transparent)}.hero-code{position:absolute;top:42px;right:0;color:#38bdf86e;font:9px/1.8 var(--mono);text-align:left;transform:rotate(5deg);pointer-events:none}.avatar-wrap{position:relative;width:128px;height:128px;margin:0 auto 21px}.story-ring{width:128px;height:128px;position:relative;padding:4px;border-radius:50%;isolation:isolate;box-shadow:0 0 35px #0ea5e924;animation:ring-glow 5s ease-in-out infinite}.story-ring::before{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(#F58529,#DD2A7B,#8134AF,#0EA5E9,#F4A261,#F58529);animation:spin 10s linear infinite;z-index:-1}.avatar-inner{position:relative;width:120px;height:120px;border:5px solid var(--bg);background:#111f31;border-radius:50%;overflow:hidden}.avatar-inner img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}.avatar-fallback{position:absolute;inset:0;background:linear-gradient(105deg,#793c28 0%,#b46e3c 38%,#192d42 51%,#061b2d 100%);display:grid;place-items:center;isolation:isolate}.avatar-fallback::before{content:'{ }\A  const\A  </>';white-space:pre;position:absolute;right:-2px;top:8px;font:12px/2 var(--mono);color:#38bdf850;transform:rotate(-7deg)}.avatar-fallback::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(165deg,transparent 0 9px,#ffdeaa16 10px 12px,transparent 14px 21px);mask-image:linear-gradient(90deg,black,transparent 65%)}.avatar-fallback span{z-index:1;font-size:43px;font-weight:700;letter-spacing:-5px;color:#f5f0e3;text-shadow:2px 3px 0 #050b1660}.verified{position:absolute;right:0;bottom:4px;width:29px;height:29px;display:grid;place-items:center;background:var(--cyan);border:4px solid var(--bg);border-radius:50%;color:white;z-index:2;font-size:11px}.eyebrow{font:9px var(--mono);letter-spacing:2.1px;text-transform:uppercase;color:var(--peach);margin-bottom:8px}.hero h1{font-size:38px;letter-spacing:-1.9px;line-height:1.15;font-weight:700}.hero h1 span{color:var(--sky)}.hero-role{font-size:13px;color:#c9d6e5;margin-top:12px}.code-tag{display:inline-flex;flex-wrap:wrap;justify-content:center;gap:5px;margin-top:17px;padding:8px 10px;background:#050b167a;border:1px solid #6c85a822;border-radius:7px;font:9px/1.7 var(--mono)}.code-tag .keyword{color:var(--sky)}.code-tag .string{color:var(--peach)}.hero-bio{max-width:365px;margin:17px auto 0;color:var(--muted);font-size:14px;line-height:1.75}.location{display:flex;align-items:center;justify-content:center;gap:6px;color:#aabacd;margin-top:15px;font-size:11px}.location .icon{width:13px;height:13px;color:var(--peach)}.location .separator{color:#40516a;padding:0 3px}.social-bar{display:flex;justify-content:center;gap:12px;margin-top:23px}.social-link{width:47px;height:47px;border-radius:13px;display:grid;place-items:center;position:relative;font-size:19px;background:#0f1b2ec0;border:1px solid var(--line);box-shadow:3px 3px 0 #02070e}.social-link:hover{transform:translateY(-4px);color:var(--sky);border-color:var(--sky);box-shadow:0 5px 22px #0ea5e918}.tooltip{position:absolute;bottom:calc(100% + 9px);left:50%;transform:translateX(-50%);font:9px var(--mono);padding:5px 8px;white-space:nowrap;background:#203044;border:1px solid var(--line);border-radius:5px;opacity:0;pointer-events:none;transition:opacity .2s}.social-link:hover .tooltip,.social-link:focus-visible .tooltip{opacity:1}.hero-cta{margin-top:23px;width:100%}.button{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:47px;padding:12px 16px;border-radius:11px;font-size:13px;font-weight:700;line-height:1.35;text-align:center}.button-primary{background:var(--cyan);color:#02111c;box-shadow:3px 3px 0 #044369;border:1px solid #54c9ff55}.button-primary:hover{background:#38bdf8;box-shadow:3px 3px 0 #06608c,0 0 24px #0ea5e91f}.button-secondary{background:#112037;border:1px solid #26425c;color:#d5e5f3;box-shadow:3px 3px 0 #02070e}.button-secondary:hover{border-color:var(--cyan);background:#142a42}.button-quiet{color:#b8c9dd;border:1px solid #26394e;background:#0a1626}.button-quiet:hover{color:var(--text);border-color:#51708d}.full{width:100%}.section-nav{display:flex;margin:26px 0 0;border-top:1px solid #20334a;border-bottom:1px solid #20334a}.section-nav a{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;min-height:46px;color:#9eafc4;font:10px var(--mono)}.section-nav a span{color:var(--sky);font-size:9px}.section-nav a:hover{color:white;background:#0ea5e908}.section-nav a+a{border-left:1px solid #20334a}

    /* 03. SKILLS — accordions nativos: acessíveis mesmo sem JS */
    .section{padding-top:38px;scroll-margin-top:22px}.section-heading{display:flex;align-items:center;gap:11px;font:9px var(--mono);letter-spacing:1.4px;color:var(--sky);margin-bottom:11px}.section-heading::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,#0ea5e938,transparent)}.section h2{font-size:25px;line-height:1.25;letter-spacing:-.9px;font-weight:600}.section-intro{font-size:12px;line-height:1.7;color:var(--muted);margin-top:10px}.skill-list{display:grid;gap:10px;margin-top:21px}.skill-card{border-radius:13px;overflow:hidden}.skill-card summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:11px;padding:15px;min-height:76px}.skill-card summary::-webkit-details-marker{display:none}.skill-symbol{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:#0ea5e912;color:var(--sky);border:1px solid #0ea5e926;font-size:16px;flex-shrink:0}.skill-card:nth-child(even) .skill-symbol{color:var(--peach);background:#d9773610;border-color:#d9773628}.skill-summary{flex:1;min-width:0}.skill-summary h3{font-size:13px;font-weight:600;letter-spacing:-.1px}.skill-summary p{font:8px/1.5 var(--mono);color:#9cadc4;margin-top:4px}.skill-chevron{color:#7c93ad;font-size:10px;transition:transform .25s}.skill-card[open] .skill-chevron{transform:rotate(180deg)}.skill-body{padding:0 15px 17px}.skill-body>p{font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:13px}.tech-tags{display:flex;flex-wrap:wrap;gap:6px}.tech-tag{font:9px/1.6 var(--mono);padding:5px 7px;background:#081323;border:1px solid #1f354d;border-radius:5px;color:#c5d6e8}.tech-tag i{color:var(--sky);margin-right:5px}.learning-line{margin-top:16px;display:flex;align-items:center;gap:10px;font:8px var(--mono);color:#91a8c0}.learning-line::before{content:'';width:42px;height:3px;border-radius:4px;background:linear-gradient(90deg,var(--clay),var(--cyan))}

    /* 04. PORTFÓLIO — filtros e previews CSS substituíveis por imagens */
    .project-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}.project-count{font:9px var(--mono);color:#8da4bf;white-space:nowrap}.filters{display:flex;gap:7px;margin:20px 0 17px;flex-wrap:wrap}.filter{font:9px var(--mono);min-height:36px;padding:8px 11px;border:1px solid #25364b;border-radius:7px;background:#0b1728;color:#9bb0c8;transition:background .2s,border-color .2s,color .2s}.filter[aria-pressed="true"]{color:#6dd0fd;background:#0ea5e917;border-color:#0ea5e966}.filter:hover{border-color:var(--sky);color:white}.project-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}.project-card{border-radius:14px;overflow:hidden;position:relative;animation:card-enter .35s ease both}.project-card:hover{box-shadow:0 8px 28px #0003}.project-preview{position:relative;background:#0a1728;overflow:hidden}.window-bar{height:25px;padding:0 10px;display:flex;align-items:center;gap:4px;border-bottom:1px solid #ffffff08;background:#091322;color:#7891aa}.window-dot{width:5px;height:5px;border-radius:50%;background:#ec715f}.window-dot:nth-child(2){background:#e9b95b}.window-dot:nth-child(3){background:#6fb99a}.window-label{font:7px var(--mono);margin-left:6px;opacity:.85}.preview-stage{position:relative;aspect-ratio:16/9;isolation:isolate;background:radial-gradient(ellipse at 80% 30%,#0ea5e918,transparent 65%),#0c1a2b}.preview-stage>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2}.concept-mark{position:absolute;z-index:3;right:8px;bottom:7px;background:#06101bd9;border:1px solid #ffffff20;border-radius:4px;padding:3px 5px;color:#b9cadd;font:6px var(--mono);letter-spacing:.5px}.project-body{padding:17px}.stack-badge{font:8px/1.7 var(--mono);color:var(--sky);display:block;margin-bottom:8px}.project-title{font-size:19px;font-weight:600;line-height:1.25;letter-spacing:-.5px}.project-description{font-size:12px;line-height:1.65;color:var(--muted);margin-top:9px}.project-actions{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:17px}.project-actions .button{font-size:10px;min-height:39px;padding:10px}.project-actions .button-secondary{box-shadow:2px 2px 0 #02070e}.detail-button{min-width:42px;padding:8px 10px;color:#c1d4e9;border:1px solid #30415a;border-radius:8px;background:#102036;font-size:10px}.detail-button:hover{color:var(--sky);border-color:var(--cyan)}.project-note{display:flex;gap:6px;align-items:center;color:#879bb4;font:8px/1.7 var(--mono);margin-top:13px}.project-note .icon{width:12px;height:12px}
    /* Previews vetoriais em HTML/CSS: nenhum arquivo de imagem obrigatório. */
    .mini-ui{position:absolute;inset:15px 18px;box-shadow:0 10px 30px #0004;display:grid;grid-template-columns:30px 1fr;border:1px solid #ffffff14;border-radius:5px;overflow:hidden;background:#101f30}.mini-sidebar{background:#081422;display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:11px}.mini-logo{width:13px;height:13px;border-radius:4px;background:#0ea5e9;display:grid;place-items:center;color:#05111b;font:bold 9px var(--sans)}.mini-sidebar>b{display:block;width:10px;height:3px;background:#4d6886;border-radius:2px}.mini-content{padding:12px;min-width:0}.mini-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}.mini-title{font-size:9px;font-weight:700;color:#eaf4fe}.mini-pill{font:5px var(--mono);padding:3px 5px;color:#72d2ff;background:#0ea5e916;border-radius:3px}.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.mini-stat{border:1px solid #ffffff0b;border-radius:4px;background:#ffffff03;padding:6px}.mini-stat small{font:5px var(--mono);color:#91a4bb;display:block}.mini-stat strong{display:block;font-size:11px;font-weight:600;margin-top:3px}.mini-lines{display:grid;gap:6px;margin-top:11px}.mini-row{display:flex;align-items:center;gap:5px;border-bottom:1px solid #ffffff08;padding-bottom:4px}.mini-avatar{width:9px;height:9px;border-radius:50%;background:#d97736}.mini-row>b{height:3px;border-radius:3px;background:#7692ad45;flex:1}.mini-row>em{width:23px;height:6px;border-radius:2px;background:#0ea5e928}.mini-chart{display:flex;align-items:flex-end;height:57px;gap:6px;margin-top:10px;border-bottom:1px solid #ffffff19;background:repeating-linear-gradient(0deg,transparent 0 17px,#ffffff07 18px 19px)}.mini-chart span{flex:1;border-radius:2px 2px 0 0;background:linear-gradient(#38bdf8,#0ea5e929)}.mini-chart span:nth-child(2n){background:linear-gradient(#f4a261,#d9773626)}.mini-chart-labels{display:flex;justify-content:space-between;font:5px var(--mono);color:#899db5;margin-top:5px}.mini-finance .mini-logo{background:var(--peach)}.mini-finance .mini-stat strong{color:#cdeaf4}.mini-studio{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 30% 40%,#d9773626,transparent 55%),radial-gradient(ellipse at 80% 80%,#0ea5e926,transparent 55%)}.mini-phone{width:88px;padding:10px 8px;border:2px solid #4e677f;border-radius:13px;background:#081322;transform:rotate(-8deg);box-shadow:8px 12px 0 #0003;text-align:center}.mini-phone-logo{margin:auto auto 5px;width:22px;height:22px;display:grid;place-items:center;border:1px solid var(--cyan);border-radius:50%;font-size:8px;font-weight:bold;color:var(--sky)}.mini-phone h4{font-size:9px;margin:0 0 3px}.mini-phone small{font:4px var(--mono);color:#a9bad0;display:block}.mini-phone a{display:block;background:#16304b;border:1px solid #0ea5e936;font-size:4px;padding:5px;margin-top:5px;border-radius:3px}.mini-annotations{margin-left:18px;font:9px/2.2 var(--mono);color:#9aaec6}.mini-annotations span{color:var(--peach);display:block;font-size:6px;letter-spacing:1px}.mini-bot{position:absolute;inset:0;padding:18px 28px;background:radial-gradient(ellipse at 50% 65%,#0ea5e911,transparent 75%)}.mini-bot-head{display:flex;align-items:center;gap:7px;font-size:9px;font-weight:600;margin-bottom:12px}.mini-bot-head>b{width:22px;height:22px;display:grid;place-items:center;color:#6ad3ae;background:#1b795f27;border:1px solid #6ad3ae33;border-radius:7px}.mini-message{font:7px/1.6 var(--sans);background:#1b3149;border:1px solid #ffffff09;border-radius:6px 6px 6px 0;padding:7px 9px;max-width:85%;margin-bottom:7px;color:#c5d7e7}.mini-message.reply{margin-left:auto;border-radius:6px 6px 0 6px;background:#14463d;color:#9ee5c7}.mini-flow{display:flex;align-items:center;gap:6px;font:6px var(--mono);color:#83c8f0;margin-top:10px}.mini-flow span{padding:4px 5px;border:1px solid #0ea5e933;border-radius:3px}

/* --- Arquivo: src/utils/helpers.js --- */
function safeURL(value) {
  try {
    const url = new URL(value);
    return ['https:', 'http:'].includes(url.protocol) ? url.href : '';
  } catch {
    return '';
  }
}

function whatsappURL(message = CONFIG.mensagens.geral) {
  return `https://wa.me/${String(CONFIG.whatsapp).replace(/\D/g, '')}?text=${encodeURIComponent(
    message
  )}`;
}

function publicPortfolioURL() {
  const configured = safeURL(CONFIG.siteUrl);
  if (configured) return configured;
  if (typeof window !== 'undefined' && ['https:', 'http:'].includes(window.location.protocol)) {
    return window.location.href.split('#')[0];
  }
  return '';
}

function vcardEscape(value) {
  return String(value ?? '')
    .replace(/\\/g, '\\\\')
    .replace(/\r?\n/g, '\\n')
    .replace(/;/g, '\\;')
    .replace(/,/g, '\\,');
}

function foldVCardLine(line) {
  const encoder = new TextEncoder();
  const chunks = [];
  let current = '';
  let length = 0;

  for (const character of line) {
    const size = encoder.encode(character).length;
    if (length + size > 75) {
      chunks.push(current);
      current = ' ';
      length = 1;
    }
    current += character;
    length += size;
  }
  chunks.push(current);
  return chunks.join('\r\n');
}

function buildVCard() {
  const lines = [
    'BEGIN:VCARD',
    'VERSION:3.0',
    `N:${vcardEscape(CONFIG.nomeContato.sobrenome)};${vcardEscape(CONFIG.nomeContato.nome)};;;`,
    `FN:${vcardEscape(CONFIG.nome)}`,
    `ORG:${vcardEscape(CONFIG.empresa)}`,
    `TITLE:${vcardEscape(CONFIG.titulo)}`,
    `TEL;TYPE=CELL:+${String(CONFIG.whatsapp).replace(/\D/g, '')}`,
    `URL:${publicPortfolioURL() || safeURL(CONFIG.redes.github)}`,
    `NOTE:${vcardEscape(
      `WhatsApp: ${whatsappURL()}\nInstagram: ${CONFIG.redes.instagram}\nLinkedIn: ${CONFIG.redes.linkedin}\n${CONFIG.localizacao} — Todo o Brasil`
    )}`,
    'END:VCARD',
  ];
  return lines.map(foldVCardLine).join('\r\n') + '\r\n';
}

function downloadVCardFile() {
  const blob = new Blob([buildVCard()], { type: 'text/vcard;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `${CONFIG.nome
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-')}.vcf`;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

function manualCopyText(text) {
  const input = document.createElement('textarea');
  input.value = text;
  input.setAttribute('readonly', '');
  input.style.cssText = 'position:fixed;top:0;left:-9999px;opacity:0';
  document.body.appendChild(input);
  input.select();
  input.setSelectionRange(0, text.length);
  let copied = false;
  try {
    copied = document.execCommand('copy');
  } catch {
    copied = false;
  }
  input.remove();
  return copied;
}


/* --- Arquivo: src/components/AmbientBackground.js --- */
function AmbientBackground() {
  const [progress, setProgress] = useState(0);

  useEffect(() => {
    let scheduled = false;

    const updateProgress = () => {
      const total = document.documentElement.scrollHeight - window.innerHeight;
      const current = total > 0 ? Math.min(100, Math.max(0, (window.scrollY / total) * 100)) : 0;
      setProgress(current);
      scheduled = false;
    };

    const onScrollOrResize = () => {
      if (!scheduled) {
        scheduled = true;
        requestAnimationFrame(updateProgress);
      }
    };

    updateProgress();
    window.addEventListener('scroll', onScrollOrResize, { passive: true });
    window.addEventListener('resize', onScrollOrResize, { passive: true });

    return () => {
      window.removeEventListener('scroll', onScrollOrResize);
      window.removeEventListener('resize', onScrollOrResize);
    };
  }, []);

  return (
    <>
      <a className="skip-link" href="#conteudo">
        Pular para o conteúdo
      </a>

      <div
        className="scroll-progress"
        style={{ width: `${progress}%` }}
        aria-hidden="true"
      />

      <div className="ambient" aria-hidden="true">
        <span className="particle" style={{ left: '9%', top: '16%' }} />
        <span className="particle" style={{ left: '22%', top: '69%' }} />
        <span className="particle" style={{ left: '82%', top: '23%' }} />
        <span className="particle" style={{ left: '91%', top: '76%' }} />
        <span className="particle" style={{ left: '15%', top: '44%' }} />
        <span className="particle" style={{ left: '75%', top: '91%' }} />

  name: 'Emerson Santos',
  mindset: 'Design & Código',
  color: '#0ea5e9'
};

function create(idea) {
  return idea.map(build);
}`}</pre>

        <pre className="ambient-code right">{`<Experience>
  <Design />
  <Code />
  <Human />
</Experience>

// always learning.
// always building.`}</pre>
      </div>

      <span className="desktop-note left" aria-hidden="true">
        DESIGN + CÓDIGO + EDIÇÕES
      </span>
      <span className="desktop-note right" aria-hidden="true">
        MACEIÓ, AL · BRASIL

}

function normalizeImageSrc(rawSrc) {
  if (!rawSrc) return '';
  const trimmed = String(rawSrc).trim();
  if (/^(https?:|data:)/i.test(trimmed)) return trimmed;
  const withoutPublic = trimmed.replace(/^\/?public\//i, '/');
  return withoutPublic.startsWith('/') ? withoutPublic : `/${withoutPublic}`;
}

function Footer({ onShowToast, onOpenCopyModal }) {
  const handleShare = async () => {
    const url = publicPortfolioURL();
    if (!url) {
      onShowToast('Publique o portfólio para compartilhar o link.');
      return;
    }

    const data = {
      title: `${CONFIG.nome} | Portfólio`,
      text: 'Design, Código & Edições. Conheça meu portfólio!',
      url,
    };

    if (navigator.share && (!navigator.canShare || navigator.canShare(data))) {
      try {
        await navigator.share(data);
        return;
      } catch (error) {
        if (error.name === 'AbortError') return;
      }
    }

    let copied = false;
    if (navigator.clipboard?.writeText && window.isSecureContext) {
      try {
        await navigator.clipboard.writeText(url);
        copied = true;
      } catch {
        copied = false;
      }
    }
    if (!copied) {
      copied = manualCopyText(url);
    }

    if (copied) {
      onShowToast('Link copiado!');
    } else {
      onOpenCopyModal(url);
    }
  };

  const handleSaveVCard = () => {
    downloadVCardFile();
    onShowToast('Contato preparado! Abra o arquivo .vcf para salvar.');
  };

  return (
    <footer className="footer">
      <p className="footer-top">Sempre aprendendo. Sempre criando.</p>

      <div className="footer-actions">
        <button
          type="button"
          className="button button-quiet press"
          onClick={handleShare}
        >
          <span className="icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              strokeWidth="1.7"
              aria-hidden="true"
            >
              <path d="M12 16V3m-5 5 5-5 5 5M5 13v7h14v-7" />
            </svg>
          </span>
          Compartilhar Portfólio
        </button>

        <button
          type="button"
          className="button button-quiet press"
          onClick={handleSaveVCard}
        >
          <span className="icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              strokeWidth="1.7"
              aria-hidden="true"
            >
              <rect x="4" y="3" width="16" height="18" rx="2" />
              <circle cx="12" cy="9" r="2.5" />
              <path d="M8 17c0-4 8-4 8 0M2 7h3m-3 5h3m-3 5h3" />
            </svg>
          </span>
          Salvar Contato <span className="sr-only">vCard .vcf</span>
        </button>
      </div>

      <p className="footer-signature">
        © {CONFIG.ano} <strong>{CONFIG.nome}</strong>
        <br />

        {CONFIG.localizacao.replace(', ', ' - ')}

      <p className="footer-cnpj">CNPJ {CONFIG.cnpj}</p>
      <a className="back-top" href="#topo">
        Voltar ao topo <span aria-hidden="true">↑</span>
      </a>
    </footer>
  );
}

/* --- Arquivo: src/components/modals/BriefingModal.js --- */
function BriefingModal({
  isOpen,
  initialIdea = '',
  onClose,
}) {
  const [name, setName] = useState('');
  const [service, setService] = useState('');
  const [idea, setIdea] = useState('');

  useEffect(() => {
    if (initialIdea) {
      setIdea(initialIdea);
    }
  }, [initialIdea]);

  useEffect(() => {
    if (!isOpen) return undefined;
    const handleKeyDown = (e) => {
      if (e.key === 'Escape') onClose();
    };
    window.addEventListener('keydown', handleKeyDown);
    return () => window.removeEventListener('keydown', handleKeyDown);
  }, [isOpen, onClose]);

  if (!isOpen) return null;

  const handleSubmit = (e) => {
    e.preventDefault();
    const trimmedName = name.trim();
    if (!trimmedName) return;

    const selectedService = service || CONFIG.servicos[0];
    const trimmedIdea = idea.trim();
    const message = `Olá Emerson! Meu nome é ${trimmedName}. Conheci seu portfólio e gostaria de conversar sobre ${selectedService}.${
      trimmedIdea ? `\n\nMinha ideia: ${trimmedIdea}` : ''
    }\n\nPodemos conversar sobre o projeto?`;

    window.location.assign(whatsappURL(message));
  };

  return (
    <div
      className="modal-backdrop-overlay"
      onClick={(e) => {
        if (e.target === e.currentTarget) onClose();
      }}
    >
      <dialog
        open
        className="modal react-modal-open"
        aria-labelledby="briefingTitle"
        aria-modal="true"
      >
        <div className="modal-inner">
          <div className="modal-header">
            <div>
              <p className="modal-eyebrow">GXCODEV / VAMOS CRIAR</p>
              <h2 id="briefingTitle">
                Sua ideia começa
                <br />
                com uma conversa<span className="sky">.</span>
              </h2>
            </div>
            <button
              type="button"
              className="close-modal"
              onClick={onClose}
              aria-label="Fechar briefing"
            >
              ✕
            </button>
          </div>

          <p className="form-intro">
            Conte um pouco do que você precisa. Vou preparar uma mensagem para
            continuarmos no WhatsApp.
          </p>

          <form onSubmit={handleSubmit}>
            <div className="form-field">
              <label htmlFor="briefingName">
                Como posso te chamar? <span className="form-required">*</span>
              </label>
              <input
                id="briefingName"
                name="nome"
                autoComplete="given-name"
                placeholder="Seu nome"
                maxLength={80}
                required
                value={name}
                onChange={(e) => setName(e.target.value)}
              />
            </div>

            <div className="form-field">
              <label htmlFor="briefingService">
                O que vamos criar? <span className="form-required">*</span>
              </label>
              <select
                id="briefingService"
                name="servico"
                required
                value={service}
                onChange={(e) => setService(e.target.value)}
              >
                <option value="" disabled>
                  Selecione um serviço
                </option>
                {CONFIG.servicos.map((srv) => (
                  <option key={srv} value={srv}>
                    {srv}
                  </option>
                ))}
              </select>
            </div>

            <div className="form-field">
              <label htmlFor="briefingIdea">
                Me conta sua ideia <span className="muted">(opcional)</span>
              </label>
              <textarea
                id="briefingIdea"
                name="ideia"
                placeholder="Seu negócio, seu desafio ou a solução que você imagina…"
                maxLength={1200}
                rows={3}
                value={idea}
                onChange={(e) => setIdea(e.target.value)}
              />
            </div>

            <button
              type="submit"
              className="button button-primary press full briefing-submit"
            >
              <i className="fa-brands fa-whatsapp" aria-hidden="true" />
              Continuar no WhatsApp <span aria-hidden="true">↗</span>
            </button>

            <p className="form-help">
              Você revisa e envia a mensagem no WhatsApp. Os dados deste

        </div>
      </dialog>
    </div>
  );
}

function CopyLinkModal({ url, onClose }) {
  const inputRef = useRef(null);

  useEffect(() => {
    if (!url) return undefined;
    const handleKeyDown = (e) => {
      if (e.key === 'Escape') onClose();
    };
    window.addEventListener('keydown', handleKeyDown);
    return () => window.removeEventListener('keydown', handleKeyDown);
  }, [url, onClose]);

  if (!url) return null;

  const handleSelectLink = () => {
    if (inputRef.current) {
      inputRef.current.focus();
      inputRef.current.select();
      inputRef.current.setSelectionRange(0, url.length);
    }
  };

  return (
    <div
      className="modal-backdrop-overlay"
      onClick={(e) => {
        if (e.target === e.currentTarget) onClose();
      }}
    >
      <dialog
        open
        className="modal react-modal-open"
        aria-labelledby="copyTitle"
        aria-modal="true"
      >
        <div className="modal-inner">
          <div className="modal-header">
            <div>
              <p className="modal-eyebrow">COMPARTILHAR</p>
              <h2 id="copyTitle">
                Leve esse link com você<span className="sky">.</span>
              </h2>
            </div>
            <button
              type="button"
              className="close-modal"
              onClick={onClose}
              aria-label="Fechar compartilhamento"
            >
              ✕
            </button>
          </div>

          <p className="form-intro">
            Selecione e copie o endereço abaixo para compartilhar.
          </p>
          <label className="sr-only" htmlFor="copyLink">
            Endereço do portfólio
          </label>
          <input
            ref={inputRef}
            className="copy-link-field"
            id="copyLink"
            value={url}
            readOnly
          />
          <button
            type="button"
            className="button button-secondary full"
            style={{ marginTop: '14px' }}
            onClick={handleSelectLink}
          >
            Selecionar link
          </button>
        </div>
      </dialog>
    </div>
  );
}


/* --- Arquivo: src/App.js --- */
function App() {
  const [selectedProject, setSelectedProject] = useState(null);
  const [briefingOpen, setBriefingOpen] = useState(false);
  const [briefingIdea, setBriefingIdea] = useState('');
  const [copyModalUrl, setCopyModalUrl] = useState('');
  const [toastMessage, setToastMessage] = useState('');
  const toastTimerRef = useRef(null);

  useEffect(() => {
    document.title = `${CONFIG.nome} — Arte, código & solução`;
    return () => {
      if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
    };
  }, []);

  useEffect(() => {
    const anyModalOpen = Boolean(selectedProject || briefingOpen || copyModalUrl);
    document.documentElement.style.overflow = anyModalOpen ? 'hidden' : '';
    document.body.style.overflow = anyModalOpen ? 'hidden' : '';
    return () => {
      document.documentElement.style.overflow = '';
      document.body.style.overflow = '';
    };
  }, [selectedProject, briefingOpen, copyModalUrl]);

  const showToast = (message) => {
    if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
    setToastMessage(message);
    toastTimerRef.current = setTimeout(() => {
      setToastMessage('');
    }, 3400);
  };

  const handleRequestBudgetWithProject = (project) => {
    setSelectedProject(null);
    if (project) {
      setBriefingIdea(
        `Gostaria de uma solução inspirada no projeto ${project.titulo}.`
      );
    }
    setBriefingOpen(true);
  };

  return (
    <>
      <AmbientBackground />

      <div className="portfolio max-w-[460px] mx-auto" id="topo">
        <div className="container px-4">
          <Topbar />

          <main id="conteudo">
            <HeroSection onOpenBriefing={() => setBriefingOpen(true)} />
            <StackSection />
            <ProjectsSection onOpenProject={setSelectedProject} />
            <StudioSection onOpenBriefing={() => setBriefingOpen(true)} />
          </main>

          <Footer
            onShowToast={showToast}
            onOpenCopyModal={(url) => setCopyModalUrl(url)}
          />
        </div>
      </div>

      <FloatingElements toastMessage={toastMessage} />

      <ProjectModal
        project={selectedProject}
        onClose={() => setSelectedProject(null)}
        onRequestBudgetWithProject={handleRequestBudgetWithProject}
      />

      <BriefingModal
        isOpen={briefingOpen}
        initialIdea={briefingIdea}
        onClose={() => setBriefingOpen(false)}
      />

      <CopyLinkModal
        url={copyModalUrl}
        onClose={() => setCopyModalUrl('')}
      />
    </>
  );
}


const rootElement = document.getElementById('root');
if (rootElement) {

}
